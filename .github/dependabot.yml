version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7  # adopt an action release only after a week, a guard against a compromised release
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      ci-tools:
        patterns:
          - "*"
