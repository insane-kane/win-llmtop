name: Release Gate

on:
  push:
    branches:
      # staging only: main moves only to a commit whose gate already passed here, and its
      # release tag is pushed moments later, so a run on main could only ever fail
      - staging
  workflow_dispatch:

permissions: {}

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Run release gate
        run: python -I .github/scripts/release_gate.py
