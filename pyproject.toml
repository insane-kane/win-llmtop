[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "win-llmtop"
version = "0.4.1"
description = "A live terminal panel for llama.cpp's llama-server on Windows: GPU and shared memory, RAM, requests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license-files = ["LICENSE"]
license = "GPL-3.0-or-later"
classifiers = [
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: 3.15",
	"Operating System :: Microsoft :: Windows",
	"Environment :: Console",
	"Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/insane-kane/win-llmtop"
Issues = "https://github.com/insane-kane/win-llmtop/issues"

[project.scripts]
win-llmtop = "llmtop:main"

[tool.setuptools]
py-modules = ["llmtop"]
packages = ["llmtop_lib"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F", "B"]

[tool.coverage.run]
source = ["llmtop", "llmtop_lib"]
